[package]
name = "serenvale"
version = "0.1.0"
edition = "2024"
authors = ["ShenEternity"]

[dependencies]
avian2d = "0.7.0"
bevy = {version = "0.19.1", default-features = false, features = ["bevy_text", "bevy_ui", "ui", "2d"] }
